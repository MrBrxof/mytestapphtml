<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аудиозвонок (PeerJS)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #16213e;
            padding: 30px 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 400px;
        }
        
        /* Иконка-аватарка вместо камеры */
        .avatar-container {
            width: 120px;
            height: 120px;
            background: #0f3460;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.2);
            transition: 0.3s;
        }
        .avatar-container.active {
            box-shadow: 0 0 25px rgba(233, 69, 96, 0.8);
            animation: pulse 1.5s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(233, 69, 96, 0.4); }
            100% { transform: scale(1.05); box-shadow: 0 0 30px rgba(233, 69, 96, 1); }
        }
        .avatar-container svg {
            width: 60px;
            height: 60px;
            fill: #e94560;
        }

        .code-box {
            background: #0f3460;
            padding: 15px;
            font-size: 26px;
            letter-spacing: 5px;
            font-weight: bold;
            border-radius: 8px;
            margin: 15px 0;
            user-select: text;
            color: #43e97b;
        }
        input {
            width: 80%;
            padding: 12px;
            font-size: 18px;
            text-align: center;
            text-transform: uppercase;
            border: 2px solid #e94560;
            border-radius: 8px;
            background: #1a1a2e;
            color: #fff;
            margin-bottom: 15px;
            outline: none;
        }
        input:focus {
            border-color: #43e97b;
        }
        
        /* Кнопки */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }
        button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
            width: 85%;
        }
        .btn-call {
            background: #43e97b;
            color: #1a1a2e;
        }
        .btn-call:hover {
            background: #38c869;
        }
        .btn-hangup {
            background: #e94560;
            color: white;
            display: none; /* Скрыта по умолчанию */
        }
        .btn-hangup:hover {
            background: #d83a54;
        }
        button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Аватарка (иконка аналогичная видео) -->
        <div class="avatar-container" id="avatar">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>

        <h2>Твой код:</h2>
        <div class="code-box" id="my-code">...</div>
        
        <input type="text" id="partner-code" placeholder="КОД ДРУГА" maxlength="6">
        
        <div class="btn-group">
            <button id="connect-btn" class="btn-call">
                <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                Позвонить
            </button>
            <button id="hangup-btn" class="btn-hangup">
                <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.52-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
                Сбросить
            </button>
        </div>

        <div id="status">Инициализация микрофона...</div>
    </div>

    <!-- Аудио элемент для звука собеседника -->
    <audio id="remote-audio" autoplay></audio>

    <script>
        function generateUniqueId() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let id = '';
            for (let i = 0; i < 6; i++) {
                id += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return id;
        }

        const myCode = generateUniqueId();
        document.getElementById('my-code').innerText = myCode;
        
        const statusText = document.getElementById('status');
        const connectBtn = document.getElementById('connect-btn');
        const hangupBtn = document.getElementById('hangup-btn');
        const partnerInput = document.getElementById('partner-code');
        const avatar = document.getElementById('avatar');
        const remoteAudio = document.getElementById('remote-audio');

        const peer = new Peer(myCode);
        let localStream;
        let currentCall = null; // Переменная для хранения текущего звонка

        // Запрашиваем доступ ТОЛЬКО к микрофону
        navigator.mediaDevices.getUserMedia({ video: false, audio: true })
            .then(stream => {
                localStream = stream;
                statusText.innerText = "Микрофон работает. Готов к звонкам.";
            })
            .catch(err => {
                console.error('Ошибка доступа к микрофону:', err);
                statusText.innerText = "Ошибка: Разрешите доступ к микрофону!";
            });

        // Функция изменения интерфейса при звонке
        function setCallState(isCalling) {
            if (isCalling) {
                connectBtn.style.display = 'none';
                hangupBtn.style.display = 'flex';
                partnerInput.disabled = true;
                avatar.classList.add('active'); // Включаем анимацию пульсации
            } else {
                connectBtn.style.display = 'flex';
                hangupBtn.style.display = 'none';
                partnerInput.disabled = false;
                avatar.classList.remove('active'); // Выключаем пульсацию
                remoteAudio.srcObject = null;
                currentCall = null;
            }
        }

        // Обработка ВХОДЯЩЕГО звонка
        peer.on('call', call => {
            statusText.innerText = "Входящий звонок... Соединяем!";
            currentCall = call;
            
            call.answer(localStream); // Отвечаем своим аудио
            
            call.on('stream', remoteStream => {
                remoteAudio.srcObject = remoteStream;
                statusText.innerText = "Разговор начат!";
                setCallState(true);
            });

            // Если собеседник сбросил звонок
            call.on('close', () => {
                statusText.innerText = "Собеседник завершил вызов.";
                setCallState(false);
            });
        });

        // ИСХОДЯЩИЙ звонок
        connectBtn.addEventListener('click', () => {
            const partnerCode = partnerInput.value.trim().toUpperCase();
            
            if (partnerCode.length !== 6) {
                alert("Код должен состоять из 6 символов!");
                return;
            }

            statusText.innerText = `Звоним ${partnerCode}...`;
            
            const call = peer.call(partnerCode, localStream);
            currentCall = call;
            
            call.on('stream', remoteStream => {
                remoteAudio.srcObject = remoteStream;
                statusText.innerText = "Разговор начат!";
                setCallState(true);
            });

            call.on('close', () => {
                statusText.innerText = "Вызов завершен.";
                setCallState(false);
            });

            call.on('error', err => {
                statusText.innerText = "Ошибка соединения.";
                setCallState(false);
                console.error(err);
            });
        });

        // КНОПКА СБРОСА
        hangupBtn.addEventListener('click', () => {
            if (currentCall) {
                currentCall.close(); // Закрываем WebRTC соединение
            }
            statusText.innerText = "Вы сбросили вызов.";
            setCallState(false);
        });

        // Ошибки PeerJS
        peer.on('error', err => {
            console.error(err);
            statusText.innerText = "Ошибка: " + err.type;
            setCallState(false);
        });
    </script>
</body>
</html>
