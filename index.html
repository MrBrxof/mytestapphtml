<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>7leaf</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #18181b;
            color: #e4e4e7;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- ЭКРАН АВТОРИЗАЦИИ --- */
        #auth-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #18181b; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 50;
            transition: opacity 0.3s;
        }
        .auth-card {
            background: #202024; border: 1px solid #3f3f46; padding: 40px;
            border-radius: 20px; width: 100%; max-width: 400px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .auth-logo { font-size: 32px; font-weight: 700; color: #4ade80; margin-bottom: 30px; letter-spacing: 1px; }
        .auth-buttons, .auth-step { display: none; flex-direction: column; gap: 16px; }
        .auth-step.active, .auth-buttons.active { display: flex; }
        
        .auth-card input {
            background: #27272a; border: 1px solid #3f3f46; padding: 14px;
            border-radius: 10px; color: #fff; font-size: 16px; outline: none; transition: 0.2s;
        }
        .auth-card input:focus { border-color: #4ade80; }
        .auth-card h3 { margin-bottom: 8px; font-size: 18px; color: #fff; }
        .auth-card p { margin-bottom: 20px; font-size: 14px; color: #a1a1aa; }
        
        .btn-primary { background: #4ade80; color: #18181b; border: none; padding: 14px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn-primary:hover { background: #22c55e; }
        .btn-secondary { background: transparent; color: #a1a1aa; border: 1px solid #3f3f46; padding: 14px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-secondary:hover { background: #27272a; color: #fff; }
        
        .avatar-options { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .avatar-preset { width: 60px; height: 60px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; object-fit: cover; }
        .avatar-preset.selected { border-color: #4ade80; }
        #avatar-upload { display: none; }
        .upload-btn { background: #3f3f46; padding: 10px; border-radius: 8px; font-size: 13px; cursor: pointer; color: #fff; margin-bottom: 10px;}
        .skip-btn { font-size: 13px; color: #71717a; text-decoration: underline; cursor: pointer; margin-top: 10px; }

        /* --- ГЛАВНЫЙ ИНТЕРФЕЙС --- */
        #app-screen { display: none; width: 100%; height: 100%; }
        
        /* ЛЕВАЯ ПАНЕЛЬ */
        .sidebar { width: 340px; background: #202024; border-right: 1px solid #3f3f46; display: flex; flex-direction: column; z-index: 10; transition: 0.3s; }
        .sidebar-inner { padding: 20px; display: flex; flex-direction: column; height: 100%; }

        /* Шапка сайдбара (Статус + Моя аватарка) */
        .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        
        .main-status {
            font-size: 24px;
            font-weight: 700;
            color: #4ade80;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
        }
        .main-status.error { color: #ef4444; font-size: 20px; }
        .main-status.connecting { color: #a1a1aa; font-size: 20px; }
        
        /* Анимация точек */
        .animated-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
        }

        .avatar-circle { width: 44px; height: 44px; border-radius: 50%; background: #3f3f46; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #fff; object-fit: cover; }

        /* Поиск */
        .search-box { display: flex; background: #27272a; border: 1px solid #3f3f46; border-radius: 10px; overflow: hidden; margin-bottom: 8px; transition: 0.3s; align-items: center; padding-right: 4px; }
        .search-box:focus-within { border-color: #4ade80; }
        .search-box input { flex: 1; background: transparent; border: none; padding: 12px 14px; color: #fff; font-size: 14px; outline: none; }
        .btn-search { background: transparent; color: #a1a1aa; border: none; padding: 8px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
        .btn-search:hover { color: #4ade80; background: rgba(74, 222, 128, 0.1); }
        #add-status { font-size: 12px; margin-bottom: 20px; min-height: 15px; color: #a1a1aa; text-align: center; }

        /* Список друзей */
        .friend-list { flex: 1; overflow-y: auto; list-style: none; }
        .friend-list::-webkit-scrollbar { width: 4px; }
        .friend-list::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        .friend-item { position: relative; background: #27272a; border: 1px solid #3f3f46; padding: 12px 16px; border-radius: 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s; }
        .friend-item:hover { background: #303036; }
        .friend-item.active { border-color: #4ade80; background: #2e3648; }
        .friend-avatar-small { width: 40px; height: 40px; border-radius: 50%; background: #3f3f46; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; color: #fff; object-fit: cover; }
        .friend-item-info { display: flex; flex-direction: column; flex: 1; }
        .friend-item-name { font-weight: 600; font-size: 15px; }
        
        /* Бейдж новых сообщений */
        .unread-badge {
            background: #4ade80;
            color: #18181b;
            font-size: 11px;
            font-weight: 700;
            height: 20px;
            min-width: 20px;
            padding: 0 6px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ПРАВАЯ ПАНЕЛЬ */
        .main-area { flex: 1; display: flex; flex-direction: column; background: #18181b; position: relative; overflow: hidden; }
        
        /* Пустое состояние (теперь просто черный фон) */
        .empty-state { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; background: #18181b; display: flex;}

        /* Шапка чата */
        .chat-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: #202024; border-bottom: 1px solid #3f3f46; z-index: 10; }
        .chat-header-info { display: flex; align-items: center; gap: 12px; }
        .btn-back { display: none; background: transparent; border: none; color: #a1a1aa; cursor: pointer; padding: 8px; margin-left: -8px; }
        .chat-peer-name { font-size: 18px; font-weight: 600; color: #fff; }
        
        .btn-call { background: transparent; color: #4ade80; border: none; padding: 10px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .btn-call:hover { background: rgba(74, 222, 128, 0.1); }

        /* Зона звонка */
        .active-call-area { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px; background: radial-gradient(circle at center, #27272a 0%, #18181b 100%); border-bottom: 1px solid #3f3f46; }
        .active-call-area.visible { display: flex; }
        .call-avatar { width: 100px; height: 100px; border-radius: 50%; border: 2px solid #3f3f46; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; background: #3f3f46; color: #fff; margin-bottom: 16px; transition: 0.3s; object-fit: cover; }
        .call-avatar.pulsing { border-color: #4ade80; box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4); animation: pulse-green 1.5s infinite; }
        @keyframes pulse-green { to { box-shadow: 0 0 0 30px rgba(74, 222, 128, 0); } }
        #call-status { color: #a1a1aa; margin-bottom: 24px; font-weight: 500; }
        
        .call-controls { display: flex; gap: 16px; }
        .btn-hangup, .btn-mute {
            color: white; border: none; width: 50px; height: 50px; border-radius: 50%; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .btn-hangup { background: #ef4444; }
        .btn-hangup:hover { background: #dc2626; }
        .btn-mute { background: #3f3f46; }
        .btn-mute:hover { background: #52525b; }
        .btn-mute.muted { background: #eab308; color: #18181b; }

        /* Сообщения */
        .chat-messages { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 75%; padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-wrap: break-word;}
        .msg.in { background: #27272a; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg.out { background: #4ade80; color: #18181b; align-self: flex-end; border-bottom-right-radius: 4px; }
        
        /* Системные сообщения (звонки и тд) */
        .msg.system {
            align-self: center;
            background: rgba(63, 63, 70, 0.5);
            color: #a1a1aa;
            font-size: 12px;
            padding: 6px 16px;
            border-radius: 16px;
            text-align: center;
            max-width: 90%;
        }

        /* Ввод сообщения */
        .chat-input-area { padding: 16px 24px; background: #202024; border-top: 1px solid #3f3f46; display: flex; gap: 12px; }
        .chat-input-area input { flex: 1; background: #27272a; border: 1px solid #3f3f46; padding: 14px; border-radius: 8px; color: #fff; font-size: 15px; outline: none; transition: 0.2s; }
        .chat-input-area input:focus { border-color: #4ade80; }
        .btn-send { background: #4ade80; border: none; border-radius: 8px; width: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; color: #18181b; }
        .btn-send:hover { background: #22c55e; }

        /* Модалка */
        .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: 0.3s; }
        .overlay.visible { opacity: 1; pointer-events: auto; }
        .modal { background: #27272a; border: 1px solid #3f3f46; padding: 32px; border-radius: 20px; text-align: center; width: 340px; transform: scale(0.9); transition: 0.3s; }
        .overlay.visible .modal { transform: scale(1); }
        .modal h2 { margin: 0 0 8px 0; font-size: 20px; }
        .modal p { color: #a1a1aa; margin-bottom: 24px; }
        .modal-btns { display: flex; gap: 12px; }
        .modal-btns button { flex: 1; padding: 12px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; }
        .btn-accept { background: #4ade80; color: #18181b; }
        .btn-reject { background: #ef4444; color: white; }

        /* АДАПТИВНОСТЬ */
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: absolute; height: 100%; top: 0; left: 0; background: #18181b; }
            .sidebar.hidden-mobile { transform: translateX(-100%); }
            .main-area { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: translateX(100%); transition: 0.3s; z-index: 20;}
            .main-area.visible-mobile { transform: translateX(0); }
            .btn-back { display: block; }
            .empty-state { display: none; }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН АВТОРИЗАЦИИ И РЕГИСТРАЦИИ -->
    <div id="auth-screen">
        <div class="auth-card">
            <div class="auth-logo">7leaf</div>
            
            <div id="auth-init" class="auth-buttons active">
                <button class="btn-primary" onclick="showLogin()">Войти</button>
                <button class="btn-secondary" onclick="showRegStep(1)">Зарегистрироваться</button>
            </div>

            <div id="auth-login" class="auth-step">
                <h3>Вход</h3>
                <input type="text" id="login-user" placeholder="Ваш юз (логин)">
                <input type="password" id="login-pass" placeholder="Пароль">
                <button class="btn-primary" onclick="doLogin()">Войти</button>
                <button class="btn-secondary" onclick="resetAuth()">Назад</button>
            </div>

            <div id="reg-step-1" class="auth-step">
                <h3>Шаг 1: Имя</h3>
                <p>Как вас будут видеть друзья?</p>
                <input type="text" id="reg-name" placeholder="Отображаемое имя">
                <button class="btn-primary" onclick="showRegStep(2)">Далее</button>
                <button class="btn-secondary" onclick="resetAuth()">Отмена</button>
            </div>

            <div id="reg-step-2" class="auth-step">
                <h3>Шаг 2: Юз (логин)</h3>
                <p>Уникальный ник для поиска.</p>
                <input type="text" id="reg-user" placeholder="Только английские буквы и цифры" oninput="this.value = this.value.toLowerCase().replace(/[^a-z0-9]/g, '')">
                <button class="btn-primary" onclick="showRegStep(3)">Далее</button>
            </div>

            <div id="reg-step-3" class="auth-step">
                <h3>Шаг 3: Пароль</h3>
                <p>Придумайте надежный пароль.</p>
                <input type="password" id="reg-pass" placeholder="Пароль">
                <button class="btn-primary" onclick="showRegStep(4)">Далее</button>
            </div>

            <div id="reg-step-4" class="auth-step">
                <h3>Шаг 4: Аватарка</h3>
                <p>Выберите фото или пропустите.</p>
                <div class="avatar-options">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" class="avatar-preset" onclick="selectPreset(this)">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka" class="avatar-preset" onclick="selectPreset(this)">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Milo" class="avatar-preset" onclick="selectPreset(this)">
                </div>
                <label class="upload-btn">
                    Загрузить своё фото
                    <input type="file" id="avatar-upload" accept="image/*" onchange="handleFileUpload(event)">
                </label>
                <button class="btn-primary" onclick="finishReg()">Завершить</button>
                <span class="skip-btn" onclick="finishReg(true)">Пропустить (будет 1-я буква)</span>
            </div>
        </div>
    </div>

    <!-- ГЛАВНЫЙ ИНТЕРФЕЙС ПРИЛОЖЕНИЯ -->
    <div id="app-screen">
        <!-- САЙДБАР -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-inner">
                
                <!-- Шапка с аватаром и статусом -->
                <div class="top-bar">
                    <div class="main-status connecting" id="conn-text">Подключение<span class="animated-dots"></span></div>
                    <div class="avatar-circle" id="my-avatar-display">?</div>
                </div>

                <!-- Поиск -->
                <div class="search-box">
                    <input type="text" id="friend-input" placeholder="Поиск" oninput="this.value = this.value.toLowerCase().replace(/[^a-z0-9]/g, '')" onkeypress="if(event.key === 'Enter') addFriend()">
                    <button class="btn-search" id="add-friend-btn" onclick="addFriend()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </button>
                </div>
                <div id="add-status"></div>

                <ul class="friend-list" id="friend-list"></ul>
            </div>
        </div>

        <!-- ОСНОВНАЯ ЗОНА -->
        <div class="main-area" id="main-area">
            <div class="empty-state" id="empty-state"></div>

            <div class="chat-header">
                <div class="chat-header-info">
                    <button class="btn-back" id="btn-back">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
                    </button>
                    <div class="chat-avatar friend-avatar-small" id="chat-avatar-top" style="margin-right:8px;"></div>
                    <div class="chat-peer-name" id="chat-title-name">Имя</div>
                </div>
                <button class="btn-call" id="btn-call" title="Позвонить">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg>
                </button>
            </div>

            <div class="active-call-area" id="call-area">
                <div class="call-avatar" id="call-avatar"></div>
                <div id="call-status">Подключение...</div>
                
                <div class="call-controls">
                    <button class="btn-mute" id="btn-mute" title="Вкл/Выкл микрофон">
                        <svg id="icon-mic-on" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                        <svg id="icon-mic-off" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                    </button>
                    <button class="btn-hangup" id="btn-hangup" title="Завершить вызов">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M21 15.46L16.28 14c-.38-.11-.79-.01-1.07.28l-2.73 2.73c-3.13-1.63-5.69-4.18-7.31-7.31l2.73-2.73c.29-.29.39-.7.28-1.07L6.73 3.19C6.42 2.27 5.27 2 4.4 2H3.5C2.67 2 2 2.67 2 3.5c0 10.22 8.28 18.5 18.5 18.5.83 0 1.5-.67 1.5-1.5v-.9c0-.87-.27-2.02-1.05-2.61L21 15.46z" transform="rotate(135 12 12)"/></svg>
                    </button>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages"></div>

            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Написать сообщение...">
                <button class="btn-send" id="btn-send">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ЗВОНКОВ/ЗАПРОСОВ -->
    <div class="overlay" id="modal-overlay">
        <div class="modal">
            <h2 id="modal-title">...</h2>
            <p id="modal-desc">...</p>
            <div class="modal-btns">
                <button class="btn-reject" id="modal-reject">Отклонить</button>
                <button class="btn-accept" id="modal-accept">Принять</button>
            </div>
        </div>
    </div>

    <!-- АУДИО ЭЛЕМЕНТЫ -->
    <audio id="remote-audio" autoplay></audio>
    <audio id="incoming-ringtone" src="souncall.mp3" loop preload="auto"></audio>

    <script>
        // === 1. ЛОГИКА АВТОРИЗАЦИИ ===
        let currentUser = JSON.parse(localStorage.getItem('7leaf_user'));
        let selectedAvatar = null;

        function checkAuth() {
            if (currentUser && currentUser.username) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                initApp();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('app-screen').style.display = 'none';
            }
        }

        function resetAuth() {
            document.querySelectorAll('.auth-step, .auth-buttons').forEach(el => el.classList.remove('active'));
            document.getElementById('auth-init').classList.add('active');
        }
        function showLogin() {
            document.querySelectorAll('.auth-step, .auth-buttons').forEach(el => el.classList.remove('active'));
            document.getElementById('auth-login').classList.add('active');
        }
        function showRegStep(step) {
            if (step === 2 && !document.getElementById('reg-name').value.trim()) return alert("Введите имя!");
            if (step === 3 && !document.getElementById('reg-user').value.trim()) return alert("Введите юз!");
            if (step === 4 && !document.getElementById('reg-pass').value.trim()) return alert("Введите пароль!");
            
            document.querySelectorAll('.auth-step, .auth-buttons').forEach(el => el.classList.remove('active'));
            document.getElementById('reg-step-' + step).classList.add('active');
        }

        function selectPreset(imgEl) {
            document.querySelectorAll('.avatar-preset').forEach(el => el.classList.remove('selected'));
            imgEl.classList.add('selected');
            selectedAvatar = imgEl.src;
        }
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                selectedAvatar = ev.target.result;
                alert("Фото загружено!");
            };
            reader.readAsDataURL(file);
        }

        function finishReg(skipAvatar = false) {
            const name = document.getElementById('reg-name').value.trim();
            const user = document.getElementById('reg-user').value.trim();
            const pass = document.getElementById('reg-pass').value;
            
            let finalAvatar = selectedAvatar;
            if (skipAvatar || !finalAvatar) finalAvatar = "";

            currentUser = { displayName: name, username: user, password: pass, avatar: finalAvatar };
            localStorage.setItem('7leaf_user', JSON.stringify(currentUser));
            
            let allAccounts = JSON.parse(localStorage.getItem('7leaf_accounts') || '{}');
            allAccounts[user] = currentUser;
            localStorage.setItem('7leaf_accounts', JSON.stringify(allAccounts));

            checkAuth();
        }

        function doLogin() {
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value;
            let allAccounts = JSON.parse(localStorage.getItem('7leaf_accounts') || '{}');
            
            if (allAccounts[user] && allAccounts[user].password === pass) {
                currentUser = allAccounts[user];
                localStorage.setItem('7leaf_user', JSON.stringify(currentUser));
                checkAuth();
            } else {
                alert("Неверный юз или пароль!");
            }
        }

        function renderAvatarHtml(name, avatarStr) {
            if (avatarStr && (avatarStr.startsWith('data:') || avatarStr.startsWith('http'))) {
                return `<img src="${avatarStr}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
            }
            return name ? name.charAt(0).toUpperCase() : '?';
        }


        // === 2. ОСНОВНАЯ ЛОГИКА ПРИЛОЖЕНИЯ (PEERJS) ===
        let peer = null;
        let localStream = null;
        let currentCall = null;
        let isMuted = false;
        
        let friends = JSON.parse(localStorage.getItem('7leaf_friends') || '{}');
        let chatHistory = JSON.parse(localStorage.getItem('7leaf_chats') || '{}');
        let unreadCounts = JSON.parse(localStorage.getItem('7leaf_unread') || '{}');
        let activeChatId = null;

        function setConnStatus(state) {
            const txt = document.getElementById('conn-text');
            txt.className = 'main-status'; // Reset classes
            
            if (state === 'connecting') { 
                txt.innerHTML = 'Подключение<span class="animated-dots"></span>'; 
                txt.classList.add('connecting');
            } else if (state === 'connected') { 
                txt.innerHTML = '7leaf'; 
            } else if (state === 'error') { 
                txt.innerHTML = 'Ошибка сети'; 
                txt.classList.add('error');
            }
        }

        function initApp() {
            document.getElementById('my-avatar-display').innerHTML = renderAvatarHtml(currentUser.displayName, currentUser.avatar);

            setConnStatus('connecting');
            peer = new Peer(currentUser.username, { config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] } });

            peer.on('open', () => {
                setConnStatus('connected');
                navigator.mediaDevices.getUserMedia({ video: false, audio: true })
                    .then(stream => localStream = stream)
                    .catch(err => console.error("Микрофон недоступен", err));
            });
            peer.on('disconnected', () => { setConnStatus('error'); setTimeout(() => peer.reconnect(), 3000); });
            peer.on('error', err => { setConnStatus('error'); console.error(err); });

            peer.on('connection', conn => {
                conn.on('data', data => {
                    if (data.type === 'CHAT') {
                        playNotify();
                        saveFriendProfile(data.from, data.profile);
                        saveMessage(data.from, data.from, data.text);
                    }
                    else if (data.type === 'FRIEND_REQ') {
                        playNotify();
                        showModal("Заявка в друзья", `${data.profile.displayName} хочет добавить вас.`, 
                            () => { 
                                saveFriendProfile(data.from, data.profile);
                                sendData(data.from, { type: 'FRIEND_ACC', from: currentUser.username, profile: getMyProfile() });
                            }, () => {}
                        );
                    }
                    else if (data.type === 'FRIEND_ACC') {
                        playNotify();
                        saveFriendProfile(data.from, data.profile);
                        showStatus("Заявка принята!", '#4ade80');
                    }
                    else if (data.type === 'CALL_REJ') {
                        stopOutgoingCallTone();
                        document.getElementById('call-status').innerText = "Отклонено";
                        saveSystemMessage(data.from, "Собеседник отклонил звонок");
                        setTimeout(() => setCallUI(false), 2000);
                    }
                });
            });

            peer.on('call', call => {
                if (currentCall) { call.close(); return; }
                
                startIncomingRingtone();
                const callerProfile = friends[call.peer] || { displayName: call.peer, avatar: "" };
                
                showModal("Входящий звонок", `Звонит: ${callerProfile.displayName}`, 
                    () => { 
                        stopIncomingRingtone();
                        currentCall = call;
                        call.answer(localStream);
                        openChat(call.peer);
                        setupCall(call);
                        saveSystemMessage(call.peer, "Входящий звонок");
                    },
                    () => { 
                        stopIncomingRingtone();
                        sendData(call.peer, { type: 'CALL_REJ', from: currentUser.username });
                        saveSystemMessage(call.peer, "Пропущенный звонок");
                        call.close();
                    }
                );
            });

            renderFriends();
        }

        function getMyProfile() { return { displayName: currentUser.displayName, avatar: currentUser.avatar }; }

        function saveFriendProfile(username, profileObj) {
            if (!friends[username]) friends[username] = {};
            friends[username] = profileObj;
            localStorage.setItem('7leaf_friends', JSON.stringify(friends));
            renderFriends();
        }

        function sendData(targetUser, dataObj) {
            const conn = peer.connect(targetUser, { reliable: true });
            conn.on('open', () => { conn.send(dataObj); setTimeout(() => conn.close(), 500); });
            conn.on('error', () => showStatus("Абонент не в сети", "#ef4444"));
        }

        // --- ИНТЕРФЕЙС И СООБЩЕНИЯ ---
        function renderFriends() {
            const listEl = document.getElementById('friend-list');
            listEl.innerHTML = '';
            Object.keys(friends).forEach(username => {
                const profile = friends[username];
                const unread = unreadCounts[username] || 0;
                const li = document.createElement('li');
                li.className = `friend-item ${activeChatId === username ? 'active' : ''}`;
                
                let unreadHtml = unread > 0 ? `<div class="unread-badge">${unread}</div>` : '';

                li.innerHTML = `
                    <div class="friend-avatar-small">${renderAvatarHtml(profile.displayName, profile.avatar)}</div>
                    <div class="friend-item-info">
                        <div class="friend-item-name">${profile.displayName}</div>
                    </div>
                    ${unreadHtml}
                `;
                li.onclick = () => openChat(username);
                listEl.appendChild(li);
            });
        }

        document.getElementById('btn-back').onclick = () => {
            document.getElementById('sidebar').classList.remove('hidden-mobile');
            document.getElementById('main-area').classList.remove('visible-mobile');
            activeChatId = null;
            renderFriends();
        };

        function openChat(username) {
            activeChatId = username;
            const profile = friends[username];
            
            // Сбрасываем счетчик непрочитанных
            unreadCounts[username] = 0;
            localStorage.setItem('7leaf_unread', JSON.stringify(unreadCounts));

            document.getElementById('chat-title-name').innerText = profile.displayName;
            document.getElementById('chat-avatar-top').innerHTML = renderAvatarHtml(profile.displayName, profile.avatar);
            document.getElementById('call-avatar').innerHTML = renderAvatarHtml(profile.displayName, profile.avatar);
            
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('sidebar').classList.add('hidden-mobile');
            document.getElementById('main-area').classList.add('visible-mobile');
            
            renderFriends();
            renderMessages();
        }

        function renderMessages() {
            const box = document.getElementById('chat-messages');
            box.innerHTML = '';
            const msgs = chatHistory[activeChatId] || [];
            msgs.forEach(m => {
                const div = document.createElement('div');
                if (m.type === 'system') {
                    div.className = 'msg system';
                    div.innerText = m.text;
                } else {
                    div.className = `msg ${m.from === currentUser.username ? 'out' : 'in'}`;
                    div.innerText = m.text;
                }
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        }

        function saveMessage(chatId, from, text) {
            if (!chatHistory[chatId]) chatHistory[chatId] = [];
            chatHistory[chatId].push({ from, text, type: 'text' });
            localStorage.setItem('7leaf_chats', JSON.stringify(chatHistory));
            
            if (activeChatId === chatId) {
                renderMessages();
            } else if (from !== currentUser.username) {
                // Если чат не открыт, добавляем бейдж
                unreadCounts[chatId] = (unreadCounts[chatId] || 0) + 1;
                localStorage.setItem('7leaf_unread', JSON.stringify(unreadCounts));
                renderFriends();
            }
        }

        function saveSystemMessage(chatId, text) {
            if (!chatHistory[chatId]) chatHistory[chatId] = [];
            chatHistory[chatId].push({ text, type: 'system' });
            localStorage.setItem('7leaf_chats', JSON.stringify(chatHistory));
            if (activeChatId === chatId) renderMessages();
        }

        function sendTextMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !activeChatId) return;
            
            saveMessage(activeChatId, currentUser.username, text);
            sendData(activeChatId, { type: 'CHAT', text: text, from: currentUser.username, profile: getMyProfile() });
            input.value = '';
        }
        document.getElementById('btn-send').onclick = sendTextMessage;
        document.getElementById('chat-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendTextMessage(); });

        // Добавление друзей (Поиск)
        function showStatus(msg, color="#a1a1aa") {
            const el = document.getElementById('add-status');
            el.innerText = msg; el.style.color = color;
            setTimeout(() => el.innerText = "", 4000);
        }

        function addFriend() {
            const targetUser = document.getElementById('friend-input').value.trim();
            if (!targetUser) return;
            if (targetUser === currentUser.username) return showStatus("Это ваш профиль", "#a1a1aa");
            if (friends[targetUser]) return showStatus("Уже в контактах", "#a1a1aa");
            
            showStatus("Поиск...", "#a1a1aa");
            sendData(targetUser, { type: 'FRIEND_REQ', from: currentUser.username, profile: getMyProfile() });
            setTimeout(() => showStatus("Запрос отправлен (если в сети)", "#4ade80"), 1000);
            document.getElementById('friend-input').value = '';
        }

        // --- ЗВОНКИ ---
        function setCallUI(isActive, isConnecting = false) {
            const area = document.getElementById('call-area');
            const avatar = document.getElementById('call-avatar');
            const status = document.getElementById('call-status');
            
            if (isActive) {
                area.classList.add('visible');
                if (isConnecting) {
                    status.innerText = "Идут гудки...";
                    avatar.classList.remove('pulsing');
                } else {
                    status.innerText = "Идет разговор";
                    avatar.classList.add('pulsing');
                }
            } else {
                area.classList.remove('visible');
                document.getElementById('remote-audio').srcObject = null;
                currentCall = null;
                stopOutgoingCallTone();
                stopIncomingRingtone();
                
                // Сброс мьюта при завершении
                if (isMuted) toggleMute(); 
            }
        }

        function setupCall(call) {
            call.on('stream', stream => {
                stopOutgoingCallTone();
                stopIncomingRingtone();
                document.getElementById('remote-audio').srcObject = stream;
                setCallUI(true, false);
            });
            call.on('close', () => {
                setCallUI(false);
                saveSystemMessage(call.peer, "Звонок завершен");
            });
            call.on('error', () => setCallUI(false));
        }

        document.getElementById('btn-call').onclick = () => {
            if (!activeChatId || currentCall || !localStream) return;
            startOutgoingCallTone();
            setCallUI(true, true);
            const call = peer.call(activeChatId, localStream);
            currentCall = call;
            setupCall(call);
            saveSystemMessage(activeChatId, "Исходящий звонок");
        };

        document.getElementById('btn-hangup').onclick = () => {
            if (currentCall) currentCall.close();
            setCallUI(false);
        };

        // Логика Микрофона
        function toggleMute() {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            
            const btn = document.getElementById('btn-mute');
            const iconOn = document.getElementById('icon-mic-on');
            const iconOff = document.getElementById('icon-mic-off');
            
            if (isMuted) {
                btn.classList.add('muted');
                iconOn.style.display = 'none';
                iconOff.style.display = 'block';
            } else {
                btn.classList.remove('muted');
                iconOn.style.display = 'block';
                iconOff.style.display = 'none';
            }
        }
        document.getElementById('btn-mute').onclick = toggleMute;


        // --- МОДАЛКА И ЗВУКИ ---
        const overlay = document.getElementById('modal-overlay');
        let modalAccCb, modalRejCb;
        function showModal(title, desc, onAcc, onRej) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            modalAccCb = onAcc; modalRejCb = onRej;
            overlay.classList.add('visible');
        }
        function hideModal() { overlay.classList.remove('visible'); }
        document.getElementById('modal-accept').onclick = () => { if(modalAccCb) modalAccCb(); hideModal(); };
        document.getElementById('modal-reject').onclick = () => { if(modalRejCb) modalRejCb(); hideModal(); };

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        document.body.addEventListener('click', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });

        function playTone(freq, type, duration, vol = 0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        let callToneInterval;
        const incomingAudioElement = document.getElementById('incoming-ringtone');
        
        function playNotify() {
            playTone(600, 'sine', 0.1, 0.2);
            setTimeout(() => playTone(800, 'sine', 0.2, 0.2), 150);
        }
        function startIncomingRingtone() { incomingAudioElement.play().catch(e=>console.log(e)); }
        function stopIncomingRingtone() { incomingAudioElement.pause(); incomingAudioElement.currentTime = 0; }
        function startOutgoingCallTone() {
            if (callToneInterval) return;
            const callTone = () => playTone(440, 'sine', 1.0, 0.05);
            callTone(); callToneInterval = setInterval(callTone, 3000);
        }
        function stopOutgoingCallTone() { clearInterval(callToneInterval); callToneInterval = null; }

        // Запуск
        checkAuth();

    </script>
</body>
</html>
